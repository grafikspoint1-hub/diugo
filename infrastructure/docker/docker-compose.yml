services:
  postgres:
    image: postgres:16-alpine
    container_name: mydiu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mydiu
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: mydiu
    ports:
      - "5432:5432"
    volumes:
      - mydiu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydiu -d mydiu"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: mydiu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mydiu_redisdata:/data
volumes:
  mydiu_pgdata:
  mydiu_redisdata:
